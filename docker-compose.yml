version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: marketup_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: marketup
    ports:
      - "5432:5432"
    volumes:
      - .docker-data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer
    container_name: marketup_adminer
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
