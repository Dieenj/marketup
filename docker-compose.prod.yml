version: "3.8"

services:
  # 1. Main Postgres database container (persistent production storage)
  postgres:
    image: postgres:16-alpine
    container_name: marketup_postgres_prod
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password  # In production, override this in your .env
      POSTGRES_DB: marketup
    ports:
      - "5432:5432"
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    networks:
      - marketup_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always

  # 2. NestJS REST API server
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: marketup_api_prod
    ports:
      - "3001:3001"
    environment:
      - DATABASE_URL=postgresql://postgres:password@postgres:5432/marketup?schema=public
      - JWT_SECRET=${JWT_SECRET:-your-super-secret-jwt-key-change-in-production}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-7d}
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - SMTP_FROM=${SMTP_FROM}
      - FRONTEND_URL=http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - marketup_network
    restart: always

  # 3. Next.js storefront client
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: marketup_web_prod
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:3001
      - NEXT_PUBLIC_APP_URL=http://localhost:3000
      - NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY}
    depends_on:
      - api
    networks:
      - marketup_network
    restart: always

volumes:
  postgres_prod_data:
    driver: local

networks:
  marketup_network:
    driver: bridge
